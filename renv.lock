      "LazyLoad": "TRUE",
      "ByteCompile": "TRUE",
      "URL": "https://future.futureverse.org, https://github.com/futureverse/future",
      "BugReports": "https://github.com/futureverse/future/issues",
      "Language": "en-US",
      "Encoding": "UTF-8",
